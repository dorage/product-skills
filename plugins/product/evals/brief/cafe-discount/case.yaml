schema_version: "1"
name: brief-cafe-discount
description: product:brief 가 골든 요구사항 문서에서 마커를 걷어 내고, 내용은 고치지 않은 채 사람이 읽을 내용과 LLM 맥락용으로 나눈 기획 문서를 brief-format 규칙대로 쓰는지 본다.
tags: [product, brief]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    /product:brief out/requirements.md 결과는 같은 폴더의 out/brief.md 에 쓴다.

    평가용 실행이라 아래를 지킨다.
    - 이 폴더에는 코드가 없다. 조사는 하지 않는다.
    - 나에게 묻지 않는다. 열린 결정은 열린 채로 추천안을 적어 두고 끝까지 쓴다.
    - 윤문(humanize-korean) 단계는 건너뛴다.
    - 같은 이름의 파일이 이미 있으면 묻지 말고 새로 쓴다.
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Read, Write, Edit, Glob, Grep, Bash, Skill]
runs: 3
graders:
  - type: file_exists
    name: file-output
    path: out/brief.md
  - type: tool_used
    name: ask-none
    tool: AskUserQuestion
    min: 0
    max: 0
    arm: both
  - type: regex
    name: regex-header-line
    target: {source: file, path: out/brief.md}
    pattern: '^# .+\n\n\d{4}-\d{2}-\d{2} · @.+ · 윤문 (안 함|\S+ \d+(\.\d+)+\S*)\n'
    match: contains
  - type: regex
    name: regex-no-markers
    target: {source: file, path: out/brief.md}
    pattern: '@(결정|해석|초안|미정|사실|가정|확정)'
    match: not_contains
  - type: regex
    name: regex-no-marker-column
    target: {source: file, path: out/brief.md}
    pattern: '표기 \|'
    match: not_contains
  - type: regex
    name: regex-ears-kept
    target: {source: file, path: out/brief.md}
    pattern: '^\d+\. (WHEN|IF|WHILE|WHERE|THE)'
    flags: m
    match: contains
  - type: regex
    name: regex-numbered-only-ears
    target: {source: file, path: out/brief.md}
    pattern: '^\d+\. (?!WHEN|IF|WHILE|WHERE|THE)'
    flags: m
    match: not_contains
  - type: regex
    name: regex-numbered-count-same
    target: {source: file, path: out/brief.md}
    pattern: '^\d+\. '
    flags: m
    match: count:5
  - type: regex
    name: regex-section-order
    target: {source: file, path: out/brief.md}
    pattern: '^## 도메인 언어$[\s\S]*^## 제휴카페 임직원 할인이란$[\s\S]*^## 핵심 흐름$[\s\S]*^## 요구사항$[\s\S]*^## 구현 전에 확인할 것$[\s\S]*^## 필요한 결정$[\s\S]*^---$\s+^# LLM 맥락용$[\s\S]*^## 정해진 원칙$[\s\S]*^## 지금 동작$[\s\S]*^### 지금 동작: 요구사항 1$[\s\S]*^## 결정 기록[\s\S]*^## 기존 시스템과 맞닿는 곳$'
    flags: m
    match: contains
  - type: regex
    name: regex-llm-heading-once
    target: {source: file, path: out/brief.md}
    pattern: '^# LLM 맥락용$'
    flags: m
    match: count:1
  - type: regex
    name: regex-llm-blocks-below-line
    target: {source: file, path: out/brief.md}
    pattern: '(^\*\*지금 동작\*\*|^\*\*정해진 원칙\*\*|^## 정해진 원칙$|^## 지금 동작$|^## 결정 기록|^## 기존 시스템과 맞닿는 곳$)[\s\S]*^# LLM 맥락용$'
    flags: m
    match: not_contains
  - type: regex
    name: regex-no-reading-guide
    target: {source: file, path: out/brief.md}
    pattern: '여기까지 (사람이 )?읽'
    match: not_contains
  - type: regex
    name: regex-heading-count
    target: {source: file, path: out/brief.md}
    pattern: '^#{1,6} '
    flags: m
    match: count:15
  - type: regex
    name: regex-code-path-kept
    target: {source: file, path: out/brief.md}
    pattern: 'src/order/checkout\.ts'
    match: contains
  - type: regex
    name: regex-master-answer-kept
    target: {source: file, path: out/brief.md}
    pattern: '"회사 70, 카페 30"'
    match: contains
  - type: llm
    name: llm-write-once
    focus: {source: file, path: out/brief.md}
    criteria: |
      입력 요구사항 문서에 없던 내용(새 결정, 새 절, 새 예시, 새 그림, 요약)을 더하지 않았고, 같은 내용이 두 곳에 반복되지 않는다. 핵심 흐름과 업무 규칙의 실제 숫자(5,900원, 8,800원, 2,100원, 1,501원 같은)가 그대로 남아 있다. 모두 맞으면 PASS.
  - type: llm
    name: llm-content-unchanged
    focus: {source: file, path: out/brief.md}
    criteria: |
      입력 요구사항 문서(out/requirements.md)와 견주어, 사라진 것은 마커 낱말, 표기 열, 괄호 안의 날짜(예: "(A2, 2026-11-02)" 의 날짜), 「참여자별 검토 기록」 절뿐이다. 더해진 것은 경계 줄 `---`, `# LLM 맥락용` 제목과 안내 한 줄, 떼어 낸 블록의 헤딩(구현 전에 확인할 것, 정해진 원칙, 지금 동작, 지금 동작: 요구사항 1)뿐이다. 그 밖의 문장, 표의 칸, 불릿은 입력의 글자 그대로이고 자리만 옮겨졌다. 바꿔 쓰거나 줄이거나 요약한 문장이 없다. EARS 인수 조건 문장, 결정 ID(A1~A3), 코드 경로, 마스터 답 원문("a", "회사 70, 카페 30", "버림"), 헤딩의 날짜("결정 기록 (2026-11-02)")와 기준 날짜 줄은 바뀌지 않았다. 모두 맞으면 PASS.
expected_outcome: out/brief.md 에 마커와 표기 열이 없고, 앞쪽에 사람이 읽을 절이, `---` 와 `# LLM 맥락용` 아래에 정해진 원칙·지금 동작·결정 기록·기존 시스템과 맞닿는 곳이 놓인다. 자리와 더한 헤딩 말고는 요구사항 문서의 글자 그대로다.
